version: '3.9'

services:
  db:
    image: postgres:16
    container_name: helpmind_db
    restart: always
    environment:
      POSTGRES_DB: helpmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: